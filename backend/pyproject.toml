[project]
name = "pnw-chatbot-backend"
version = "0.1.0"
description = "PNW Student Knowledge Chatbot backend (FastAPI + ChromaDB + Google Gemini)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "chromadb",
    "google-genai",
    "beautifulsoup4",
    "pypdf",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
