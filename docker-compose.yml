services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pnw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pnw}
      POSTGRES_DB: ${POSTGRES_DB:-pnw_chatbot}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Published on 5433 so it doesn't clash with a Postgres already running on the host.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pnw}:${POSTGRES_PASSWORD:-pnw}@db:5432/${POSTGRES_DB:-pnw_chatbot}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pg_data:
